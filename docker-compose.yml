# Neo4j 5 (Community) pour le projet P30.
# Le mot de passe n'est JAMAIS écrit ici : il vient du fichier .env (voir .env.example).
#
#   cp .env.example .env      # puis éditer NEO4J_PASSWORD (8 caractères minimum)
#   docker compose up -d
#   Neo4j Browser : http://localhost:7474   (bolt://localhost:7687)

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: p30-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Neo4j Browser
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # protocole Bolt (driver Python)
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Définir NEO4J_PASSWORD dans le fichier .env}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "256m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # Les CSV sont visibles par LOAD CSV (cypher/00_load_csv.cypher) : file:///metiers.csv
      - ./data:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
